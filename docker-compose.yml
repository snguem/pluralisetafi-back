# Full stack: frontend (nginx) -> backend (Spring Boot + LibreOffice) -> MySQL, with Keycloak.
#
# Dev / staging only: Keycloak runs in start-dev mode (no TLS, import of the test realm).
#
#   cp .env.example .env        # then adjust the values
#   docker compose up -d --build
#
# The frontend repository (snguem/pluralisetafi) must be next to this one, or set FRONTEND_CONTEXT.
#
#   frontend  http://localhost:${FRONTEND_PORT}            (also proxies /api/v1 to the backend)
#   backend   http://localhost:3302/api/v1/swagger-ui.html (host only: 127.0.0.1)
#   keycloak  http://localhost:8080                        (host only: 127.0.0.1)
#
# Keycloak and the token issuer: tokens carry the URL the browser used to get them
# (KEYCLOAK_PUBLIC_URL), which the backend validates as `iss`. Containers cannot reach
# "localhost:8080", so the backend fetches the signing keys from the internal address
# (http://keycloak:8080) instead and only checks that issuer string.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: etat_fin_app
      MYSQL_USER: ${DB_USERNAME:-pluralis}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  kc-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kc-db-data:/var/lib/mysql
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://kc-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./src/test/resources/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      kc-db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/etat_fin_app?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-pluralis}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # `iss` expected in tokens = the address the browser uses for Keycloak
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/pluraletatfin
      # signing keys are read through the internal address
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/pluraletatfin/protocol/openid-connect/certs
      # admin client used to create / block users
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_SERVICE_SECRET: ${KEYCLOAK_ADMIN_SERVICE_SECRET:?set KEYCLOAK_ADMIN_SERVICE_SECRET in .env}
    ports:
      - "127.0.0.1:3302:3302"
    volumes:
      # models, generated excels and temp files
      - backend-public:/app/public
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3302'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../pluralisetafi}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  kc-db-data:
  backend-public:
