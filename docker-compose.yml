# Backend (Spring Boot + LibreOffice) -> MySQL. Keycloak is NOT part of this file: the backend
# uses the shared Keycloak you already run (see docs/docker.md). The
# frontend is not in Docker yet: run it with `ng serve` (it calls http://localhost:3302/api/v1/).
#
#   cp .env.example .env        # then adjust the values
#   docker compose up -d --build
#
#   backend   http://localhost:3302/api/v1/swagger-ui.html (host only: 127.0.0.1)
#
# Keycloak and the token issuer: tokens carry the URL the browser used to get them
# (KEYCLOAK_PUBLIC_URL), which the backend validates as `iss`. A container cannot reach the
# host's "localhost:8080", so the signing keys and the admin API are read through
# KEYCLOAK_INTERNAL_URL (default: the host, via host.docker.internal) and only the issuer string is checked.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: etat_fin_app
      MYSQL_USER: ${DB_USERNAME:-pluralis}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/etat_fin_app?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-pluralis}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # `iss` expected in tokens = the address the browser uses for Keycloak
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:?set KEYCLOAK_REALM in .env}
      # signing keys are read through the internal address
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8080}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      # admin client used to create / block users
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?set KEYCLOAK_CLIENT_ID in .env}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?set KEYCLOAK_ADMIN_CLIENT_ID in .env}
      KEYCLOAK_ADMIN_SERVICE_SECRET: ${KEYCLOAK_ADMIN_SERVICE_SECRET:?set KEYCLOAK_ADMIN_SERVICE_SECRET in .env}
      # the front accepts files up to 25 MB (balances, correction): the backend must accept them too
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 25MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 30MB
      # JVM memory: LibreOffice runs as a separate process and needs the rest of the RAM
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=65}
      TZ: ${TZ:-UTC}
    extra_hosts:
      # lets the container reach a Keycloak running on the host (needed on Linux)
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3302:3302"
    volumes:
      # models, generated excels and temp files
      - backend-public:/app/public
      # application log (logs/app.log)
      - backend-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3302'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  db-data:
  backend-public:
  backend-logs:
